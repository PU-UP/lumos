<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas · 资料</title><link rel="stylesheet" href="/board.css"><link rel="stylesheet" href="/agents.css"><link rel="stylesheet" href="/role-knowledge.css"><link rel="stylesheet" href="/navigation.css"><script src="/navigation.js" defer></script><script src="/dialog.js" defer></script><script src="/role-knowledge.js" defer></script></head>
<body><header><div class="brand"><span class="mark">L</span><strong>Lumos</strong></div></header><nav class="view-nav" aria-label="四个助手"></nav>
<main class="agent-page"><div class="page-heading"><div><h1 id="page-title">笔记与资料</h1><p id="page-description"></p></div><label>资料范围<select id="workspace"><option value="lingguang">灵光</option><option value="lumos">Lumos 仓库维护</option></select></label><div class="tools"><button id="refresh-materials">刷新</button><a id="write-note" class="action-link">写笔记</a></div></div>
<section id="search-panel"><form id="search" class="search-form"><label>关键词<input id="query" type="search" maxlength="500" placeholder="文件名、主题或一段原文"></label><button type="submit" class="primary">查找</button><label class="check-label"><input id="archived" type="checkbox">包含已归档内容</label></form><p id="status" role="status"></p><div id="results"></div><button id="more-results" hidden>显示更多结果</button></section>
<section id="material-panel"><p id="material-status" role="status"></p><div id="library-notes"></div><div id="material-list"></div></section>
</main>
<dialog id="register-dialog" aria-labelledby="register-title"><div class="dialog-heading"><h2 id="register-title">登记项目资料</h2><button id="close-register" type="button">关闭</button></div><p id="register-file"></p><form id="register-form"><label>所属项目<select id="context" required></select></label><p id="register-status" role="status"></p><div class="form-actions"><span>只保存固定资料版本，不改任务。</span><button id="register-save" type="submit" class="primary">登记资料</button></div></form></dialog>
<dialog id="source-dialog" aria-labelledby="source-title"><div class="dialog-heading"><h2 id="source-title">资料出处</h2><button id="close-source" type="button">关闭</button></div><label id="version-label" hidden>固定版本<select id="source-version"></select></label><p id="source-status" role="status"></p><div id="source-body"></div><div id="source-actions" class="material-actions"></div></dialog>
</body></html>
