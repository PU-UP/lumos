<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lumos · 工作主线</title><link rel="stylesheet" href="/board.css"><link rel="stylesheet" href="/overview.css"><script src="/intake.js" defer></script><script src="/overview.js" defer></script></head>
<body class="management">
<header><div class="brand"><span class="mark">L</span><strong>Lumos</strong><label class="space-label"><span class="sr-only">工作空间</span><select id="workspace"><option value="lingguang">灵光</option><option value="lumos">Lumos 仓库维护</option></select></label></div><div class="tools"><button id="refresh">刷新</button><a class="record-link" href="/notes">记录进展</a></div></header>
<nav aria-label="工作视图" class="view-nav"><a href="/" id="nav-overview" aria-current="page">主线</a><a href="/tasks">全部任务</a><a href="/people">人员</a><a href="/notes">笔记</a></nav>
<main>
<div class="management-heading"><div><p id="overview-date" class="overview-date"></p><h1 id="page-title">工作主线</h1><p id="page-description" class="muted">先回答关键问题，其余安排交给 Lumos 接续。</p></div><label class="management-search"><span class="sr-only">搜索主线或任务</span><input id="search" type="search" placeholder="搜索主线、任务编号或进展"><button id="clear-search" hidden>清除搜索</button></label></div>
<nav class="mainline-views" aria-label="主线视角"><a href="/" id="view-summary">近期重点</a><a href="/?view=delivery" id="nav-delivery">阶段交付</a></nav>
<p id="message" role="status" aria-live="polite">正在读取主线与任务……</p><p id="preference-message" class="muted" role="status"></p>
<details id="attention" open><summary class="attention-heading"><span>等你回答 <span id="attention-count"></span></span><span class="attention-toggle">展开 / 收起</span></summary><div class="attention-body"><p class="attention-description">直接回答已知情况；Lumos负责接续任务、排期与下一次跟进。</p><div id="attention-items"></div><form id="feedback-form"><div class="feedback-heading"><label for="feedback-text">补充进展或处理意见</label><label class="feedback-target"><span class="sr-only">反馈对应事项</span><select id="feedback-target"><option value="">综合反馈</option></select></label></div><textarea id="feedback-text" rows="3" maxlength="20000" placeholder="直接描述最新情况、你的判断或希望如何推进；不必逐项填写。"></textarea><div class="feedback-actions"><p id="feedback-status" role="status" aria-live="polite">提交后由 Lumos 整理，可在下方查看结果。</p><button class="primary" id="feedback-submit" type="submit">交给 Lumos 整理</button></div></form></div></details>
<section id="near-term" aria-label="未来两周的阶段节点"></section>
<details id="intake-panel"><summary>反馈历史与 Lumos 处理状态</summary><div id="intake-list"></div></details>
<section aria-label="主线"><div id="mainlines"></div></section>
<section id="search-results" aria-label="匹配的任务" hidden></section>
<details id="independent"><summary id="independent-title">独立事项与未关联任务</summary><div id="independent-items"></div></details>

<footer><span>摘要按已有证据维护；任务安排与明确约定分别记录。</span><span id="sync"></span></footer>
</main>
<dialog id="mainline-detail" aria-labelledby="detail-title"><div class="detail-top"><h2 id="detail-title">主线详情</h2><button id="close-detail" autofocus>关闭</button></div><div id="detail-content"></div></dialog>
</body></html>
