<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lumos · 笔记</title><link rel="stylesheet" href="/board.css"><link rel="stylesheet" href="/notes.css"><script src="/dialog.js" defer></script><script src="/disclosure.js" defer></script><script src="/intake.js" defer></script><script src="/notes.js" defer></script></head>
<body>
<header><div class="brand"><span class="mark">L</span><strong>Lumos</strong><span class="divider">/</span><span>工作分身</span></div><button id="new-note" class="primary" disabled>＋ 新建笔记</button></header>
<nav aria-label="工作视图" class="view-nav"><a href="/">主线</a><a href="/tasks">全部任务</a><a href="/people">人员</a><a href="/notes" aria-current="page">笔记</a><a href="/chat">对话</a></nav>
<main class="notebook">
<aside aria-label="笔记列表"><div class="notebook-heading"><h1>笔记</h1><span id="note-count" class="count">0</span></div>
<label>工作空间<select id="note-workspace"><option value="lingguang">灵光</option><option value="lumos">Lumos 仓库维护</option></select></label>
<div class="list-tools"><label>查看<select id="note-status"><option value="false">未处理</option><option value="true">已归档</option></select></label><button id="refresh-notes">刷新</button></div>
<label>搜索笔记<input id="note-search" type="search" placeholder="标题或正文"></label>
<div id="drafts"></div><div id="note-list"></div></aside>
<section class="note-page" aria-label="笔记内容">
<p id="note-message" role="status" aria-live="polite"></p>
<div id="welcome"><h2>把进展写下来。</h2><p>会议要点、问题和临时想法，都可以从这里开始。</p></div>
<div id="note-editor" hidden>
<div class="note-toolbar"><label>记录日期<input id="note-date" type="date"></label><span id="save-state" role="status" aria-live="polite"></span><button id="save-note">保存当前内容</button><button id="preview-note">结束记录</button><button id="lumos-archive" class="primary">Lumos 归档</button><button id="archive-note">归档</button><button id="delete-note">删除</button></div>
<label class="title-label"><span class="sr-only">笔记标题</span><input id="note-title" maxlength="300" placeholder="未命名笔记"></label>
<label id="body-label"><span class="sr-only">笔记正文</span><textarea id="note-body" maxlength="200000" placeholder="从这里开始写……&#10;&#10;支持 # 小标题、- 列表、[文字](链接)。"></textarea></label>
<article id="note-preview" hidden></article><div id="note-related"></div>
<div id="conflict" hidden><h3>最新保存的版本</h3><p>上方保留你的草稿。请对照下方内容在上方合并，再点击“保存合并结果”。</p><pre id="remote-note"></pre><button id="merge-note">保存合并结果</button><button id="use-remote">使用最新版本（放弃本地草稿）</button></div>
<section id="note-intake" aria-label="Agent整理结果"></section>
<details id="note-history"><summary>历史版本与关联任务</summary><div id="history-content"></div></details>
<p class="note-help">输入时自动保存；结束记录后自动润色，原稿保留在历史中。关联任务只作阅读线索。</p>
<p class="note-help">Lumos 归档：由 Codex Astra 理解全文，更新知识库、主线或任务后归档。普通归档：无需 Agent 处理。<span id="note-id"></span></p>
</div></section></main>
<dialog id="note-confirm" aria-labelledby="note-confirm-title" aria-describedby="note-confirm-subject note-confirm-description note-confirm-hint">
  <div class="note-confirm-content">
    <h2 id="note-confirm-title"></h2>
    <p id="note-confirm-subject"></p>
    <p id="note-confirm-description"></p>
    <p id="note-confirm-hint"></p>
  </div>
  <form method="dialog" class="note-confirm-actions">
    <button value="cancel" autofocus>取消</button>
    <button id="note-confirm-submit" class="primary" value="confirm"></button>
  </form>
</dialog>
</body></html>
