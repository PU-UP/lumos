<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumos · 资料</title><link rel="stylesheet" href="/board.css"><link rel="stylesheet" href="/agents.css"><script src="/knowledge.js" defer></script></head>
<body><header><div class="brand"><span class="mark">L</span><strong>Lumos</strong><span class="divider">/</span><span>工作分身</span></div></header>
<nav aria-label="工作视图" class="view-nav"><a href="/">主线</a><a href="/tasks">全部任务</a><a href="/people">人员</a><a href="/notes">笔记</a><a href="/chat">对话</a><a href="/knowledge" aria-current="page">资料</a><a href="/agents">协作记录</a></nav>
<main class="agent-page"><div class="page-heading"><div><h1>资料</h1><p>查找笔记、知识依据、正式文档和已登记的项目资料。</p></div><label>工作空间<select id="workspace"><option value="lingguang">灵光</option><option value="lumos">Lumos 仓库维护</option></select></label></div>
<form id="search" class="search-form"><label>关键词<input id="query" type="search" maxlength="500" placeholder="输入名称或原文关键词，多个关键词用空格分开"></label><label class="check-label"><input id="archived" type="checkbox">包含历史归档</label><button type="submit">查找资料</button></form><p id="status" role="status" aria-live="polite">正在读取…</p><div id="results"></div>
<section><h2>登记项目资料</h2><p>从 project-materials 选择文件，保存固定版本到 Lumos 数据目录并纳入备份。原文件保留；同一路径再次登记会保留旧版本。最大 20 MB。</p><form id="register" class="material-form"><label>项目文件<select id="material" required></select></label><label>归属脉络<select id="context" required></select></label><button id="save-material" type="submit" disabled>登记固定版本</button></form><p id="material-status" role="status" aria-live="polite">正在读取文件列表…</p><p class="muted">可检索 UTF-8 文本、HTML、Word 和 PowerPoint 的正文文字。PDF、图片及其他格式先登记原件，不推定已读懂内容。</p></section></main></body></html>
