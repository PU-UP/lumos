<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumos · 查找资料</title><link rel="stylesheet" href="/board.css"><link rel="stylesheet" href="/agents.css"><link rel="stylesheet" href="/navigation.css"><script src="/navigation.js" defer></script><script src="/knowledge.js" defer></script></head>
<body><header><div class="brand"><span class="mark">L</span><strong>Lumos</strong></div></header>
<nav aria-label="工作视图" class="view-nav"><a href="/">工作</a><a href="/chat">对话</a><a href="/notes" aria-current="page">记录</a></nav>
<main class="agent-page"><nav class="section-links" aria-label="记录方式"><a href="/notes">笔记</a><a href="/knowledge" aria-current="page">查找资料</a></nav><div class="page-heading"><div><h1>查找资料</h1><p>找回笔记、项目文件和相关来源，保留每份内容的出处。</p></div><label>工作空间<select id="workspace"><option value="lingguang">灵光</option><option value="lumos">Lumos 仓库维护</option></select></label></div>
<form id="search" class="search-form"><label>想找什么<input id="query" type="search" maxlength="500" placeholder="输入名称、主题或一段原文"></label><button type="submit" class="primary">查找</button><label class="check-label"><input id="archived" type="checkbox">包含已归档内容</label></form>
<p id="status" role="status" aria-live="polite">输入关键词开始查找，也可以在对话中告诉 Lumos 你要找什么。</p><div id="results"></div>
<details id="material-panel" class="support-details"><summary>加入项目资料</summary><p>从项目资料目录选择文件，保存一份固定副本并纳入备份。原文件保留，再次登记会保留旧版本。</p><form id="register" class="material-form"><label>项目文件<select id="material" required></select></label><label>关联项目<select id="context" required></select></label><button id="save-material" type="submit" disabled>保存资料</button></form><p id="material-status" role="status" aria-live="polite"></p><details><summary>支持的格式与范围</summary><p>目录为 project-materials，每份文件最大20MB。可检索文本、HTML、Word和PowerPoint的正文；PDF、图片和其他格式先保存原件，尚未读取正文。</p></details></details></main></body></html>
